<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Barcos en Vivo</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #globe-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 16px;
            border-radius: 12px;
            z-index: 10;
            font-size: 15px;
            text-align: center;
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body>
    <div id="info">🛰️ Cargando mapa...</div>
    <div id="globe-container"></div>

    <script>
        const container = document.getElementById('globe-container');
        const info = document.getElementById('info');

        const world = Globe()(container)
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .backgroundColor('#000010')
            .htmlLat(d => d.latitude)
            .htmlLng(d => d.longitude)
            .htmlElement(d => {
                const el = document.createElement('div');
                el.innerHTML = `<div style="background:rgba(0,0,0,0.9);color:#0f0;padding:4px 8px;border-radius:6px;font-size:12px;border:1px solid #0f0;">🚢 ${(d.ShipName || 'Barco').trim()}</div>`;
                return el;
            });

        // Mejor para móvil
        world.controls().enableZoom = true;
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.4;

        const API = 'https://mapa-barcos-api.onrender.com/datos';

        function actualizar() {
            fetch(API)
                .then(r => r.json())
                .then(data => {
                    if (Array.isArray(data) && data.length > 0) {
                        const barcos = data.filter(b => b.latitude && b.longitude);
                        world.htmlElementsData(barcos);
                        info.innerHTML = `🛰️ ${barcos.length} barcos activos`;
                    } else {
                        info.innerHTML = '🛰️ Esperando barcos...';
                    }
                })
                .catch(e => {
                    info.innerHTML = '⚠️ Error de conexión<br>Reintentando...';
                    console.error(e);
                });
        }

        actualizar();
        setInterval(actualizar, 7000);
    </script>
</body>
</html>
