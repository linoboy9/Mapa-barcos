<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro de Control - Globo 3D</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #globe-container { width: 100vw; height: 100vh; }
        #info { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; z-index: 10; font-size: 12px; }
    </style>
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>
</head>
<body>
    <div id="info">🌍 Centro de Control Global - Barcos Activos</div>
    <div id="globe-container"></div>

    <script>
        const world = Globe()
            (document.getElementById('globe-container'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .htmlElementsData([])
            .htmlLat(d => d.lat)
            .htmlLng(d => d.lng)
            .htmlElement(d => {
                const el = document.createElement('div');
                el.innerHTML = `🚢 <span style="background:rgba(0,0,0,0.9); color:#00ffcc; padding:3px 6px; border-radius:4px; font-size:11px; font-weight:bold; border: 1px solid #00ffcc;">${d.nombre}</span>`;
                return el;
            });

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        fetch('posiciones.json')
            .then(response => response.json())
            .then(data => {
                world.htmlElementsData(data);
            })
            .catch(error => console.log('Error cargando datos:', error));
    </script>
</body>
</html>
