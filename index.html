<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro de Control - Barcos en Vivo</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #globe-container { width: 100vw; height: 100vh; }
        #info { position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 6px; z-index: 10; font-size: 14px; }
    </style>
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>
</head>
<body>
    <div id="info">🛰️ Cargando tráfico marítimo...</div>
    <div id="globe-container"></div>

    <script>
        const world = Globe()(document.getElementById('globe-container'))
          .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg')

          .htmlLat(d => d.lat)
          .htmlLng(d => d.lng)
          .htmlElement(d => {
            const el = document.createElement('div');
            el.innerHTML = `🚢 <span style="background: rgba(0,0,0,0.8); color: white; padding: 2px 5px; border-radius: 4px; font-size: 10px;">${d.nombre}</span>`;
            return el;
          });

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.2;

        function cargarBarcos() {
            // Añadimos un número aleatorio al final (?t=...) para evitar que el navegador guarde memoria vieja y lea siempre el archivo fresco
            fetch('posiciones.json?t=' + new Date().getTime())
              .then(response => response.json())
              .then(ships => {
                world.htmlElementsData(ships);
                document.getElementById('info').innerHTML = `🛰️ En línea: ${ships.length} barcos activos`;
              })
              .catch(error => {
                console.error('Error cargando los barcos:', error);
                document.getElementById('info').innerHTML = `⚠️ Esperando actualización de datos...`;
              });
        }

        // Cargar al iniciar
        cargarBarcos();

        // Volver a cargar los datos automáticamente cada 5 segundos para mantenerlo en tiempo real
        setInterval(cargarBarcos, 5000);
    </script>
</body>
</html>
