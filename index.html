<!DOCTYPE html>
<html>
<head>
    <title>Mapa de Tráfico de Carga Global</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Librería gratuita de mapas Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; background: #111; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializamos el mapa centrado en el mundo
        var map = L.map('map').setView([20, 0], 2);

        // Capa de diseño oscuro para que se vea estilo "centro de control"
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
        }).addTo(map);

        // Leemos el archivo con las posiciones de los barcos
        fetch('posiciones.json')
           .then( response => response.json())
            .then(data => {
                data.forEach(barco => {
                    var marker = L.marker([barco.lat, barco.lon]).addTo(map);
                    marker.bindPopup("<b>🚢 " + barco.nombre + "</b><br>Carga: " + barco.carga);
                });
            })
            .catch(error => console.log('Esperando archivo de datos...'));
    </script>
</body>
</html>
