<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Centro de Control - Globo 3D</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #globe-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #info { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 5px; z-index: 10; font-size: 11px; }
    </style>
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>
</head>
<body>
    <div id="info">🌍 Centro de Control Global - Barcos Activos</div>
    <div id="globe-container"></div>

    <script>
        const container = document.getElementById('globe-container');
        
        const world = Globe()
            (container)
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .htmlElementsData([])
            .htmlLat(d => d.lat)
            .htmlLng(d => d.lng)
            .htmlElement(d => {
                const el = document.createElement('div');
                // Aumentamos el tamaño de la letra y el padding para que se vea bien en el celular
                el.innerHTML = `🚢 <span style="background:rgba(0,0,0,0.9); color:#00ffcc; padding:6px 10px; border-radius:6px; font-size:14px; font-weight:bold; border: 2px solid #00ffcc; white-space: nowrap; box-shadow: 0 0 10px rgba(0,255,204,0.5);">${d.nombre}</span>`;
                return el;
            });

        window.addEventListener('resize', () => {
            world.width(window.innerWidth);
            world.height(window.innerHeight);
        });

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        fetch('posiciones.json')
            .then(response => response.json())
            .then(data => {
                world.htmlElementsData(data);
            })
            .catch(error => console.log('Error cargando datos:', error));
    </script>
</body>
</html>
