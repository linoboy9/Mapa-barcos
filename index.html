<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro de Control Real - Barcos</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #globe-container { width: 100vw; height: 100vh; }
        #info { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 5px; z-index: 10; font-size: 11px; }
    </style>
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>
</head>
<body>
    <div id="info">📡 Conectado al tráfico marítimo en vivo...</div>
    <div id="globe-container"></div>

    <script>
        const world = Globe()(document.getElementById('globe-container'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .htmlLat(d => d.lat)
            .htmlLng(d => d.lng)
            .htmlElement(d => {
                const el = document.createElement('div');
                el.innerHTML = `🚢 <span style="background:rgba(0,0,0,0.8); color:#00ffcc; padding:2px 4px; border-radius:3px; font-size:10px; border:1px solid #00ffcc; white-space:nowrap;">${d.nombre}</span>`;
                return el;
            });

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.2;

        const socket = new WebSocket("wss://stream.aisstream.io/v0/stream");

        socket.onopen = () => {
            console.log("Conectado al servidor de barcos");
            socket.send(JSON.stringify({
                "APIKey": "c9448c359fff4a189388f41f642c38861b9a73c5", 
                "BoundingBoxes": [[[-90, -180], [90, 180]]]
            }));
        };

        let ships = [];
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.MessageType === "PositionReport") {
                const shipName = data.MetaData.ShipName ? data.MetaData.ShipName.trim() : "Desconocido";
                const lat = data.Message.PositionReport.Latitude;
                const lng = data.Message.PositionReport.Longitude;

                const existingIndex = ships.findIndex(s => s.nombre === shipName);
                if (existingIndex >= 0) {
                    ships[existingIndex].lat = lat;
                    ships[existingIndex].lng = lng;
                } else {
                    ships.push({ nombre: shipName, lat: lat, lng: lng });
                    if (ships.length > 150) ships.shift();
                }

                world.htmlElementsData([...ships]);
            }
        };

        socket.onerror = (error) => {
            console.error("Error en el WebSocket:", error);
        };
    </script>
</body>
</html>
